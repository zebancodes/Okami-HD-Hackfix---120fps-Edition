[Main]
; Okami HD High-FPS Patch settings. This file is optional: delete it to go
; back to the defaults (the values below). Read when the game starts.

; The frame rate the game starts at: 30 (the game as shipped), 60 or 120.
; The toggle key cycles 30 -> 60 -> 120 in game and saves the choice here.
DefaultFps=60

; The key that cycles the frame rate: F1..F24, a single letter or digit,
; Home, End, Insert, Delete, Pause, ScrollLock, Numpad0..Numpad9, or None to
; turn the key off.
ToggleKey=F9

; 1 = the key only works while the game window is in front.
RequireFocus=1

; 1 = a system beep when the frame rate changes.
Beep=1

; 0 = present at once and let the patch pace the frames (best with G-Sync,
;     FreeSync or another VRR display).
; 1 = wait for the display's refresh. Only useful on a fixed-rate display in
;     windowed or borderless mode, to avoid tearing.
SyncInterval=0

; How far scenery and placed objects (grass, bushes, signs, rocks) are drawn.
; 1 = as shipped; 2 to 6 = that many times farther. More objects on screen
; cost frame time, and fog may still hide very far ones.
DrawDistance=1

; Another mod's DINPUT8.dll to load as well. Rename that mod's file (for
; example to dinput8_other.dll), put it in the game folder, and name it here.
ProxyDll=
