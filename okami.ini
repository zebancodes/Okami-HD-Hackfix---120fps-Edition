[Main]
; Okami HD high-FPS patch
;
; Press F9 in-game to toggle between:
;   60 fps  - patched smooth mode (mode pinned to the engine's 60 fps path),
;             ~55-60 fps, async presentation
;   30 fps  - stock semantics (the wall jump and every other 30 fps-tuned
;             action behave exactly like the unpatched game)
; The switch is instant, takes effect on the next frame, plays a beep and
; is logged to okami_hackfix.log.
