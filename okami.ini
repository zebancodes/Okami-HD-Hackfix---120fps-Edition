[Main]
; Okami HD high-FPS patch settings. Read once when the game starts.
; Every key is optional; the values below are the defaults.

; ---------------------------------------------------------------------------
; Frame rate
; ---------------------------------------------------------------------------

; Frame rate mode the game starts in: 60 (patched) or 30 (stock).
; 60 fps mode runs the engine at 60 ticks/s with its 60 fps configuration and
; fixes Amaterasu's movement so she covers the same ground per second as at
; 30 fps (see FixRunSpeed) and jumps to the same height (see FixJumpHeight).
; Menus and some effects still advance one step per tick, so parts of the
; interface animate faster than on the stock 30 fps.
DefaultFps=60

; Hotkey that toggles 60/30 fps in-game. Accepts F1..F24, a single letter or
; digit, Home, End, Insert, Delete, Pause, ScrollLock, Numpad0..Numpad9, or a
; hex virtual-key code (0x78 is F9). Set to None to disable the toggle.
ToggleKey=F9

; 1 = only react to hotkeys while the game window is in the foreground.
RequireFocus=1

; 1 = play a system beep when a mode or toggle changes.
Beep=1

; DXGI present sync interval used in 60 fps mode.
;   0 = present immediately and let the patch pace frames at 60 Hz
;       (recommended; pairs perfectly with G-Sync / FreeSync / VRR)
;   1 = wait for vblank before presenting. Only useful on a fixed 60 Hz
;       display in borderless or windowed mode to avoid tearing.
SyncInterval=0

; ---------------------------------------------------------------------------
; Movement fixes (verified against 30 fps by measurement)
; ---------------------------------------------------------------------------

; 1 = make Amaterasu's jog, run and dash cover the same distance per second in
; 60 fps mode as they do at 30 fps. The engine stores speed per tick, and the
; port only scaled the top dash stage, so without this the jog and run are
; roughly twice as fast and the dash ends up slower than a plain run.
FixRunSpeed=1

; 1 = keep the run, jog and dash animation playback rates at their 30 fps
; values, so the leg cycle matches the ground speed.
FixAnimRate=1

; Hotkey that switches the two fixes above off and on, for A/B comparison.
; They are independent of the experimental toggle below. None disables it.
SpeedToggleKey=F8

; 1 = make jumps reach the same height in 60 fps mode as they do at 30 fps.
; Gravity and the vertical position are both already scaled by the engine's
; time scale, so a jump is frame-rate independent -- except that the jump
; state seeds its launch velocity with timeScale * 5.0, which scales it a
; second time. Height goes as the square of the launch velocity, so without
; this a 60 fps jump reaches a quarter of its proper height. It shows up worst
; on the wall jump, which adds its impulse to a fall in progress and so barely
; lifts her at all: this is the reason the old advice was to drop to 30 fps to
; scale a wall.
FixJumpHeight=1

; Hotkey that switches the jump fix off and on, for A/B comparison. Separate
; from SpeedToggleKey so a movement test cannot change the jump by accident.
JumpToggleKey=F7

; 1 = make character actions last the same real time at 60 fps as at 30.
; The port doubles input windows for 60 fps but no object state duration, so
; every action whose length is a tick count runs twice as fast: attack and
; recovery windows, stagger, invulnerability, the pause before a jump launches
; and the float after it. This makes the five character duration fields count
; every other tick instead, at 787 sites. The engine writes that countdown three
; different ways and each had to be found separately: 259 through a register
; (`dec ax`), 422 straight against memory (`dec word ptr [obj+0xE3C]`), and 106
; as `lea new, [old - 1]` where the handler needs the value from before the
; count and so cannot afford `dec`'s flags.
FixActionTimers=1

; 1 = undo the ten input windows that are compensated twice. Most of the port's
; windows are a constant shifted by the 60 fps flag; ten sites in the player
; code build the window from the fps byte as 3 * (fps / 30), which already
; scales, and then shift it as well. Three ticks at 30 fps become twelve at 60,
; which is twice the real time, and forty-eight at 120.
FixInputWindows=1

; 1 = make repeating effects appear at the same rate per second at 60 fps as at
; 30. Footstep dust, trail sparks, ripples and aura pulses are not timed by a
; countdown at all; they are gated straight off the frame counter with
; `test byte ptr [frameCounter], 7`, so they fire twice as often at 60 fps and
; four times as often at 120. The fix widens the mask, one byte at 33 sites.
FixFrameGates=1

; 1 = slow the interface oscillators to real time. Option screens, the save
; screen, treasure and vital pickups and the enemy marker pulse by feeding the
; frame counter into a sine at ten degrees a frame, so their 1.2 s cycle
; becomes 0.6 s at 60 fps. 22 reads are retargeted at a halved copy of the
; counter; everything else that reads it is left alone.
FixFramePhases=1

; 1 = every other clock read off the frame counter, at the stock rate of the
; context (family F5): the loading screen's dots, rhythm
; window and fade, the pause menu's selection arrow, the screen wobble,
; objScroll's scrolling, shader time, and "every 15th frame" effect spawns. 34
; reads are retargeted at counters kept by a hook on flower_tick, and 9 more
; rate gates are widened. Follows the timer key (TimerToggleKey), like the two
; families above; the overlay shows "clocks /4" in play at 120 fps.
FixFrameClocks=1

; Hotkey that switches the four fixes above off and on, for A/B comparison.
TimerToggleKey=F6

; Experimental UI integer clocks (PLAN family F1), off until play-tested.
; Count in whole steps at the stock context rate: 30 Hz in gameplay, 60 Hz
; in stock menus, at either a 60 or 120 fps target. Requires the shadow mode
; and shared tick hook; if either is unavailable this family stays inactive.
; The generated manifest records the supported sites and every exclusion.
; While it is installed, the overlay's second line (outside loading screens)
; checks it live: each counter must count on one in N of the ticks it runs on
; (ticks, not passes, so a loop like the bestiary grid reads right), and where
; the stock game was recorded running a counter at one rate only (27 of 39),
; N must match that rate, not just what the patch thinks the context is.
; "CONTEXT" means it does not: worth a look, though the recording may simply
; never have seen that counter on this screen.
FixIntegerSkips=0

; Independent A/B key for the UI prototype; F6 does not change this family.
; F9 stock mode also makes every F1 instruction execute normally.
IntegerToggleKey=F4

; 1 = the day/night cycle at its stock speed: a day of 10 real minutes, and
; each scripted sky change (a brush technique, an event) in its stock time.
; The time of day advances once per tick, so at 120 fps a day took 2.5
; minutes. The advance and the sky change now run on stock ticks only (every
; 4th at 120 in play). F6 switches it off and on with the timer fixes. The
; overlay's third line shows the in-game time and minutes per in-game day
; against stock, and the last sky change's duration. Both are in game time
; (ticks at the configured rate), so they judge the fix, not the frame rate;
; when the game falls short of its rate (in the background it runs 30 ticks a
; second) the line says so, e.g. "game at 25% speed". The line also times each
; scripted time-lapse (an event moving the time of day tick by tick) against
; its stock duration. The ones on the event playhead are fixed by
; FixModeQuantities below, and the one that counts its own passes by
; FixTaskWaits: expect "OK".
FixDayClock=1

; 1 = scripted events' pauses and stepping loops at their stock length. An
; event waits between its steps (a line of text, a camera cut, a sound) by a
; number of ticks, so at 120 fps every such pause was a quarter as long. The
; 920 pauses of a fixed length (0.07 to 15.7 s at stock) and the 18 whose
; length comes from the event's data now wait that many 30 fps ticks (60 fps
; ones in the stock game's 60 Hz screens). The 211 script loops that step
; something once a pass (an object's pulse or fade, a countdown, a camera
; sequence's cue list) now make one pass per 30 fps tick; loops that only
; wait for something to be ready are left as they are. So that a camera
; sequence still sees the skip button when it looks only every 4th tick, the
; skip check also sees presses of the last 3 ticks (none at 30 fps). F6
; switches it off and on with the timer fixes. The log gets a "task waits:"
; line for each status interval in which a pause began or a loop passed.
FixTaskWaits=1

; 1 = watch the Celestial Brush and say why Rejuvenation did or did not work.
; It changes nothing in the game (it reads memory ~100 times a second, also
; with Passthrough=1). After every use of the brush the log gets a "brush:"
; line naming the stage that stopped it: no restorable target in view, the
; target's mask came back empty (a GPU readback that an add-on changing the
; game's render-target formats breaks), no stroke touched the mask, or too
; little of the mask inked (it needs 40%). Where a target was on offer it also
; writes brush_watch\attempt_NNN_<verdict>.bmp: the mask red, your ink blue,
; both yellow.
BrushWatch=1

; 1 = measure what each hit does to an enemy, to compare 120 with F9's 30. It
; changes nothing in the game: every enemy class's update is wrapped so the
; watch reads the enemy just before its update runs (also with Passthrough=1).
; When a hit enemy settles, the log gets an "enemy:" line (the class, how many
; hits and when, the ground it covered, its top height, how long it fell, how
; far it turned, the states it went through, the fps and whether the enemy
; fixes were on) and a second line with its height and distance from where it
; was hit, once per stock tick at any frame rate.
EnemyWatch=1

; 1 = the menu transitions at their stock speed:
;   - the scene transition around every options page, the memory card and
;     area changes: its slide, glide and fade;
;   - the pause menu's opening drop and bounce;
;   - the HUD sliding in and out;
;   - the pause menu's page-icon pulse.
; At 120 fps each ran 4x fast. The drop runs whole on stock ticks: it bounces
; exactly as at 30 fps, with 30 fps smoothness. Everything else moves every
; tick at a quarter of the step (half in the stock game's own 60 Hz menus).
; It follows the phase key (PhaseToggleKey), which also holds the
; transition's fade. After each phase the overlay's second line and the log
; say how long it took against stock, e.g. "glide 0.93 s (stock 0.93) OK".
FixMenuTransitions=1

; 1 = world animations at their stock speed, first set. Each ran 4x fast at
; 120 fps (2x at 60); each group below can be switched off on its own:
;   FixSkyScroll     the scrolling texture layers of objScroll models: the
;                    sky's wind and clouds, flowing water;
;   FixSwingPhysics  swinging bones: villagers' sleeves, hair and sashes, and
;                    anything else that dangles. It swung twice as fast, was
;                    damped four times as often and blown 16x by the wind;
;   FixHumanAnims    the villagers' head-bob while they talk, how often they
;                    give off mood particles (these now spawn on stock ticks
;                    only, exactly as at 30 fps), and how soon a villager stuck
;                    on its way turns harder;
;   FixParticles     every effect particle's own motion: how long it lives,
;                    its colour keys and flipbook, how it grows, spins, turns,
;                    drifts, falls and slows. Sparks, flames, the flower trail,
;                    the villagers' mood particles. It passes through its 30
;                    fps positions at every 30 fps tick and moves smoothly
;                    between them;
;   FixEmitters      how long an effect emitter waits, lives and emits, and how
;                    the free-flying ones spin and move;
;   FixTurnLimits    how fast walkers and enemies turn toward their target:
;                    every one of them turned 4x as fast at 120;
;   FixScenerySway   how trees, bushes and other placed scenery sway and pulse,
;                    and how soon they react again after being hit. The sway
;                    now steps on 30 fps ticks, exactly as at 30 fps;
;   FixObjectAnims   what objects animate themselves: the reflector's flowing
;                    texture and glow, item pickups fading in;
;   FixModeQuantities  the places where the game's own 60 fps support wrote
;                    "a step times the 30/60 fps setting", which is right at
;                    30 and 60 and 2x at 120: the event camera's path (every
;                    scripted camera move, and the dusk and midnight
;                    time-lapses), the total play time, the HUD timer's count
;                    and pulse, the control window's pulse, how long a button
;                    has been held, the menus' sprite flipbooks, the memory
;                    card's waits and the options sliders. At 120 each now runs
;                    as the game runs it at 60, which is stock's speed; at 60
;                    nothing changes;
;   FixMenuRepeat    how fast the menu cursor repeats while a direction is held:
;                    10 times a second in play and 12 in the 60 Hz menus, as at
;                    30 fps (it was 24 at 120);
;   FixEnemyClocks   enemies' state timers, which count in the enemy's own time
;                    (its speed, lower while it is slowed): how long it winds
;                    up, stays stunned, hides or waits before its next move.
;                    Each lasted a quarter of its 30 fps time at 120. Also
;                    what else an enemy steps by its speed each tick: the spin
;                    or bob of a part, a hover up and down, a fade, a timer;
;                    and how it moves by its speed: a dash or slide with its
;                    animation, a hop's rise and fall, a leap at Amaterasu,
;                    the pieces some enemies throw off or keep circling them
;                    (their flight, pull and damping). They moved 4x as fast
;                    at 120;
;   FixMenuScroll    the Files menus' lists: scrolling by a row, and a list
;                    fading and sliding in and out. The stock game runs them at
;                    60 Hz, so they ran twice as fast at 120;
;   FixTurnSteps     the other turns: an enemy turning toward Amaterasu at its
;                    own rate, and every walker, animal or object that turns
;                    its heading (or tracks her with its head) a clamped step
;                    at a time. They turned 4x as fast at 120. Snaps (a whole
;                    turn in one tick) are left as they are;
;   FixFlagQuantities  lengths the game's own 60 fps support doubles through
;                    its 60 fps setting, right at 30 and 60 and half as long
;                    at 120: every pad rumble (how long it shakes, and its
;                    delay), the screen's colour flashes and fades, and the
;                    half-second waits between the steps of the options and
;                    memory-card screens (a message before the next prompt);
;   FixSkipWindow    how long the skip prompt waits for the second press: 5 s,
;                    as at 30 fps (it was 1.25 s at 120);
;   FixPlayerAnims   what Amaterasu and her weapons still counted or moved once
;                    a tick: her countdowns, how long the three 30-second item
;                    effects last (a quarter of that at 120), her fade near
;                    the camera, the slide off something she lands on, her
;                    body's tilt on slopes, and the flights of her rosary's
;                    beads and the other weapons' thrown pieces.
; The old FixEffects experiment below must stay 0: with it on, FixParticles
; and FixEmitters stand down (it would halve the particles' speed again).
; It follows the phase key (PhaseToggleKey). The overlay's status line shows
; "world on /4 sky N swing N talk N mood N fx N em N turn N sway N obj N clk N
; str N | mode /2 cam N | rep /N": how many sky layers, swinging bones, talking
; heads, mood spawners, particles, emitters, turning actors, swaying objects,
; items, enemy clock steps and turn steps ran per tick, and how many event
; camera paths. The log gets a "world anims:"
; line per status interval; its counters read "/4 OK" when each counted on
; exactly a quarter of its ticks (the mode group's "/2 OK", half).
FixWorldAnims=1
FixSkyScroll=1
FixSwingPhysics=1
FixHumanAnims=1
FixParticles=1
FixEmitters=1
FixTurnLimits=1
FixScenerySway=1
FixObjectAnims=1
FixModeQuantities=1
FixMenuRepeat=1
FixEnemyClocks=1
FixMenuScroll=1
FixTurnSteps=1
FixFlagQuantities=1
FixSkipWindow=1
FixPlayerAnims=1

; 1 = make per-tick float counters advance at the same rate per second at
; 60 fps as at 30. These are effect lifetimes, fade and flash meters, scroll
; offsets and oscillator phases: 365 instructions that step a field by a fixed
; amount every tick. The patch halves the step rather than skipping it, so the
; motion stays smooth instead of dropping to 30 steps a second.
; Where the stock game itself ticks at 60 -- the options pages, the memory-card
; screens, the pause menu once it is open, the title -- the step is only halved
; at 120 fps and left as shipped at 60, so those screens keep their stock speed
; too. This and FixDecay below follow the stock context tick by tick.
FixPhaseSteps=1

; 1 = correct per-tick damping and smoothing. A factor applied twice as often
; decays twice as fast, so the right 60 fps value is k**timeScale, not k/2 --
; the same conversion the engine's own per-mode table uses (0.9274 = sqrt 0.86).
; 195 instructions, covering velocity bleed-off, camera smoothing and springs.
FixDecay=1

; Hotkey that switches the two fixes above off and on, for A/B comparison.
PhaseToggleKey=F5

; 1 = undo the double-scaled vertical launch velocities. 23 sites assign an
; absolute vertical velocity built as timeScale * constant, but the integrator
; scales it again, so knockbacks, pounces and launches reach a quarter of their
; height at 60 fps. Same bug as the jump, at every other site that has it.
FixLaunchVelocity=1

; The engine's frame
; config is a power-of-two ladder (30 fps: timeScale 1.0, shift 0; 60 fps: 0.5,
; shift 1) and 120 fps is the next rung: timeScale 0.25, shift 2. Everything
; this patch fixes is expressed in terms of the time scale, so it follows on
; its own, and every reader of the four config fields has now been checked:
; the shift is only ever used as a shift count, the fps byte is only ever
; divided or doubled, the time scale is only ever multiplied, and the frame
; divider turns out to have no reader at all. The game's own frame limiter
; starts from a hard-coded 60 and is retuned with them -- without that the
; engine would take quarter-sized steps 60 times a second and run at half
; speed. Measured working: a steady 120.0 ticks/s with movement and jump height
; matching 60 fps mode. Two things to know before turning it on. The engine
; advances game time by the time scale once per rendered frame, so anything
; under 120 fps is game time running slow in proportion -- 90 fps is 75% speed,
; not a choppier 100%. And frame generation or any frame limiter must be off:
; NVIDIA Smooth Motion held the render rate at 75 and the game ran at 62% speed.
; Needs a display that can actually run at 120. Off by default.
Fps120=0

; 1 = follow the engine's per-mode constants past 60 fps. The engine often
; picks its frame-rate-dependent values by testing the mode byte rather than
; the time scale, and that byte is 1 for the fast configuration whether it is
; 60 fps or 120 -- so at 120 they all keep returning the 60 fps value. That
; includes the per-tick motion advance (a hard-coded 0.5), which is why
; Amaterasu covered ground twice as fast as her legs moved at 120, and the
; port's pre-computed damping table of 60 {k**0.5, k} pairs, which made
; everything bleed off at half the rate it should. Both are corrected with the
; exponent the engine's own table implies, k**timeScale. This is exactly what
; the game ships at 60 fps, so it only does anything at 120.
FixModeConstants=1

; 1 = also follow the INTEGER half of that same family. Six sites compute
; `n * (mode == 1 ? 2 : 1)` where n is a duration in ticks -- three esp80
; keyframe-length getters, the compare that ends a keyframe, the span a
; keyframe interpolates over, and the length of a motion blend in the player's
; own animation handler. A float scan could never find these, because the
; per-mode table is the instruction itself (`add eax, eax`), and at 120 fps
; every one of them still doubles where it needs to quadruple, so whatever it
; times runs at exactly twice the speed it should. The hard-coded 2 becomes a
; value the patch holds, which it keeps at 2 below 120 fps -- so at 60 fps, at
; 30, and whenever the timer A/B key has these muted, the patched code computes
; bit for bit what the game shipped.
FixModeMultipliers=1

; 1 = scale the other half of the movement speed target. Both targets are a sum
; of two terms -- `[player+0xB0] * 1.3` and a base -- and only the base has ever
; carried the time scale. `+0xB0` is dimensionless (it holds 1.0, or 0.698 rad),
; so its contribution is in per-tick units and must scale too. The error is
; nearly invisible at 60 fps and is a 48% overspeed at 120: the dash target
; should read 2.05 per tick there and actually reads 3.025, which the log
; measured as 3.030. Flat ground is unaffected either way, which is why every
; earlier speed test passed. No-op at 30 fps and while the movement A/B is off.
FixSlopeTerm=1

; 1 = airborne acceleration takes ts^2, not ts. `v += ts*a` against
; `v *= k**ts` has a rate-dependent equilibrium: measured per-tick airborne
; speed was the SAME at 30 and 120 fps, i.e. 4x too fast in real time.
; The block is duplicated once per player state that steers in the air: the
; watchpoint saw one copy, a search for the shape found four (main+3B547C,
; 3BE265, 3C32F9, 3C9BE0). Ten more copies exist in non-player actors and are
; deliberately left alone until there is a test for them.
FixAirAccel=1

; 1 = the stick's steering while she recoils off a wall at the stock speed.
; When an attack hits a wall she recoils (player state 0x2B, then 0x2C), and
; the stick steers her: v = v * 0.86 + |stick| * 1.7/1024 a tick, then
; position += v. The decay is converted by the mode constants but the stick
; term had no time scale at all, so with the stick held she settled at 15x
; her stock speed at 120 fps (4x at 60) and was thrown across a small room
; into the opposite wall: the sake-house "pinball". The stick term is scaled
; by ts(1-k^ts)/(1-k), which keeps her settled speed and how fast she reaches
; it the same as at 30 fps. The three sites (0x2B, 0x2C and state 0x48) were
; found by shape (tools/find_tick_thresholds.py). Follows the movement key
; (SpeedToggleKey).
FixStickDrift=1

; How far placed objects are drawn: the grass tufts, bushes, signs, rocks and
; the rest of the scenery, and objects in general. 1 = as shipped. 2 to 6 draw
; them, fade them out and keep them updating out to that many times their
; stock distance (each object's own limit, 1000 or 5000 depth units); the
; stage itself is not affected. More objects on screen costs frame time, and
; very far objects may still be hidden by fog. Takes effect at the next start;
; the log says "draw distance: x2, 8 of 8 sites".
DrawDistance=1

; 1 = scale the per-tick speed thresholds in the jump path. pl00+0xE48 is a
; displacement per tick, so a constant compared against it means a different
; real speed at every tick rate. A full run is 3.05 per tick at 30 fps and 0.76
; at 120, and three comparisons land on the other side there:
;   main+3B4149  an uphill penalty of `v += slope * 8.0`, four times too large
;                at 120 fps, which the clamp below it turns into a dead stop
;   main+3B41E6  `2.0 <= v` picks the running jump (launch 5.4) over the
;                standing one (4.2); above 30 fps a run never reaches 2.0, so
;                the running jump is unreachable
;   main+3B5466  `v < 3.0` gates the airborne steering block, which is a leaky
;                integrator toward the steering speed. At 30 fps a run is above
;                the gate and keeps its launch momentum for the whole jump; at
;                120 fps it is below, and the block drains the launch speed
;                away in about 0.2 s
; No-op at 30 fps and while the movement A/B is off.
FixAirGates=1

; Per-tick damps on horizontal speed whose factor the compiler hoisted into a
; register, so `mulss xmm0, xmm6` with the 0.1 loaded far upstream. There is no
; rip operand left to match on, which is why FixDecay never found these.
;   main+3B55C0  hspeed *= 0.1 in the jump wind-up. Measured at 120 fps, this
;                took her from 1.05917 to 0.00330 units/tick in six ticks while
;                she was still standing on the ground, so she launched with a
;                third of a percent of her run speed. At 30 fps it runs a
;                quarter as often, which is the whole difference.
;   main+3B3099, main+3B30DD, main+3B3156  the same shape in the ground handler
; Eight sites, all on pl00+0xE48, each scaled to k^timeScale.
; src/hoisted_decay.h is generated by tools/find_hoisted_decay.py.
; No-op at 30 fps and while the movement A/B is off.
FixHoistDecay=1

; Still unscaled in the jog parameter struct, deliberately, because none of them
; is a duration or a per-tick velocity:
;   7A833C = 1.0  the literal 1 in `v -= 0.01*v*v`; dimensionless
;   7A8360 = 1.5  a divisor in the dash charge path (main+3B31D3)
;   7A8348 = 0.3  used by the stick/turn code at main+3A76C4
; 7A8344 (the run speed floor) was the fourth and IS scaled now -- it was the
; largest remaining ground-movement error.

; The angular approach at main+2DA510, which is how every actor in the game
; turns toward a heading: facing += k * wrap(target - facing), once per tick.
; 163 call sites, and about half pass k in a register, so there is nothing to
; retarget at the call sites -- the fix is a detour on the one function they
; all go through. k is a blend, so it is (1 - k) that carries the exponent:
;   k' = 1 - (1 - k)^timeScale        0.6 -> 0.205 at 120 fps
; The player ground turn passes 0.6; unpatched she snaps to the target heading
; three to four times too fast at 120 fps.
; 37 callers (the airborne steering among them) take k from the engine's own
; 60 fps table, already compensated; those are fed the stock value so it is
; converted once, not twice. 4 pass something that is not a per-tick blend
; (keyframe interpolation, the motion blend-in) and skip the conversion.
; This one touches every actor and the camera, not just Amaterasu. If turning
; feels wrong, set it to 0 and say so -- it is the newest and least tested of
; the movement fixes.
; No-op at 30 fps and while the movement A/B is off.
FixTurnRate=1

; Diagnostic: log every 10 ms sample of a jump's climb (height, vertical
; velocity and the physics flags). Used to measure the per-tick gravity in
; each mode; noisy, so leave it off unless you are working on the jump.
JumpTrace=0

; ---------------------------------------------------------------------------
; Interface
; ---------------------------------------------------------------------------

; 1 = draw a small status line over the game: frame rate mode, whether the
; movement fixes are active, live walking speed, and the active gate set.
Overlay=0

; Seconds between "status:" lines in okami_hackfix.log (0 = off). Each line
; also reports the player's position, path length per second and peak speed,
; so game speed can be compared between modes.
StatusInterval=5

; 1 = log every 100 ms player sample (speed, movement sub-state, dash charge,
; animation rate). Useful for comparing modes; noisy, so off by default.
SpeedLog=0

; ---------------------------------------------------------------------------
; Experimental interface timing (off by default)
;
; Menus, the HUD and effects advance one step per tick, so they animate at
; double speed in 60 fps mode. These options step whole groups of objects
; every other tick instead. Gating anything that also draws can make it
; flicker, and half-rating the effect system was measured to slow the game
; down, so all three are off until a better fix lands.
; ---------------------------------------------------------------------------

Fixes=1
FixToggleKey=F10
FixMenus=0
FixHud=0
FixEffects=0

; Game tasks to step only every other tick while fixes are active in 60 fps
; mode. Comma-separated prefixes of the task names logged as "task: ..."
; (e.g. fn=main.dll+1C1DB0 for the HUD task). Empty = none.
HalfRateTasks=

; ---------------------------------------------------------------------------
; Diagnostics (see README)
; ---------------------------------------------------------------------------

; Count-only instrumentation. "cs:<rva>" counts calls at one call site,
; "fn:<rva>:<len>[:<fixup>/...]" counts calls to a function. Comma-separated.
Probes=

; Extra half-rate gates: "<class prefix>:<vtable slot>", "<vtable rva>:<slot>",
; "fn:<rva>:<len>" or "cs:<rva>". Comma-separated.
ExtraGates=

; '|'-separated sets of probe names to half-rate, cycled in-game by SetKey,
; with matching labels in GateSetNames. Used to A/B several hypotheses in one
; play session.
GateSets=
GateSetNames=
SetKey=None

; Hotkey that writes a labelled snapshot of every probe counter to the log.
MarkKey=None

; Log the callers of the first N calls of each gate or probe (0 = off).
GateTrace=0

; Hex RVAs of bytes in main.dll to show in the status line, comma-separated.
WatchBytes=

; ---------------------------------------------------------------------------

; Forward DirectInput to another dinput8 proxy instead of the system DLL, so
; this patch can coexist with mods that also ship a DINPUT8.dll (rename the
; other mod's file and point at it here, e.g. ProxyDll=dinput8_crashfix.dll).
ProxyDll=

[Harness]

; 1 = do nothing at all. Forward DirectInput8Create, run the harness and the
; overlay, and install no patches: no fps ladder, no fixes, no mode pinning.
; F9 does nothing.
;
; This is the control. Every measurement so far has been taken against "30 fps
; mode", which is NOT the stock game -- it is this DLL with its fixes restored
; and its mode-byte writers still rewritten. If that restore is incomplete then
; the baseline is wrong and every delta measured against it inherits the error.
; A Passthrough run is the real game measured with the same instrument, and it
; is recorded in its own slot (okami_harness_stock.csv) so it can never be
; confused with a patched 30 fps run.
;
; To use it: set Passthrough=1, start the game, press F3 on flat ground, quit,
; set Passthrough=0, and run the same test in each mode. The report will compare
; against the stock run automatically.
Passthrough=0
; Scripted input test. The harness writes the analog stick and the jump button
; directly, on a fixed wall-clock script, and samples the player once per tick.
; Because the script is measured in milliseconds it means the same thing at
; every frame rate, so a 30 fps run and a 120 fps run are directly comparable --
; which is the exact property the patch is trying to establish.
;
; Use it like this:
;   1. load a save, stand on flat open ground with the camera behind you
;   2. press F9 until the log says 30 fps
;   3. press F3 and take your hands off the controller (about 4.5 s)
;   4. press F9 to go to 120 fps, press F3 again from the same spot
;   5. read the "==== 30 fps vs 120 fps ====" table in the log
; A delta of 0% on the TOTAL row means the two rates move Amaterasu the same
; distance in the same real time. Anything else is the bug, measured.
;
; 1 = install the hook at the player's per-tick state dispatcher (main+3AF020).
; It does nothing until F3 is pressed.
Harness=1

; Key that starts a run. None = disabled.
HarnessKey=F3

; What the script's "forward" writes to the stick. Flip the sign if Amaterasu
; runs towards the camera instead of away from it; the comparison is valid
; either way, but a run away from the camera is easier to watch.
HarnessStick=-127

; The input script, as steps. Omit these and the built-in script is used
; (settle, run, jump, airborne, steer across, stop -- 4500 ms).
;
;   Step<n>=<ms>,<dirX>,<dirY>,<action>,<label>
;
; ms      how long the step lasts in WALL-CLOCK milliseconds, which is what
;         makes a script mean the same thing at every frame rate
; dirX    -1, 0 or +1, scaled by HarnessStick
; dirY    same
; action  none or jump   (jump is JOY_ACTIDX 0x61, the press edge is synthesised
;         on the first tick of the step and held for the rest of it)
; label   shown on the overlay while that step runs
;
; Steps run in order from Step1 and stop at the first one missing. Up to 16.
; A malformed step falls back to the built-in script rather than running a
; half-parsed test, and says so in the log.
;
; The default, written out, is:
;   Step1=600,0,0,none,settle
;   Step2=1600,0,1,none,run
;   Step3=300,0,1,jump,jump
;   Step4=500,0,1,none,airborne
;   Step5=900,1,0,none,steer across
;   Step6=600,0,0,none,stop
;
; Two variants worth having, since neither is covered by the default:
;   a dash test -- hold longer before jumping so she reaches dash speed
;   a slope test -- same script, but run it on a hill. The report tells you
;   whether pl00+0xB0 ever left zero, i.e. whether the slope terms were
;   exercised at all.
;
; Runs taken with different scripts are NOT comparable. The script length goes
; into the record and the report refuses to compare across it quietly.

[Tracer]
; Only read by the tracer build (cmake --preset clang-tracer); the normal DLL
; ignores this section. The tracer build always runs as Passthrough -- the stock
; game -- with the overlay on, whatever [Harness] and [Main] say, because what it
; records has to describe the stock game.
;
; 0 = build loaded but nothing installed (the stock game, nothing recorded).
Enabled=1
; Ends the route step shown on the overlay, writes its file to okami_tracer\
; next to the game, and starts the next step.
NextKey=F4
; A window whose sites run more often than this per second gets its original
; bytes back, so no single hot loop can slow the game. 0 = never.
ShedPerSecond=300000
; How often the step in progress is also written to a .partial file, so a
; crash loses at most this much.
AutosaveSeconds=60
